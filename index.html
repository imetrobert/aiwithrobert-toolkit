/* Safe DOM builder: strings are always text nodes, never HTML. */
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "disabled") n.disabled = !!v;
    else if (v === true) n.setAttribute(k, "");
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
}

/* ---- Validation (AI output is untrusted: parse, check, rebuild clean) ---- */
function fmt(s, ...a) { let i = 0; return s.replace(/%s/g, () => a[i++]); }
const isStr = v => typeof v === "string";
const shorten = (s, n) => { s = String(s); return s.length > n ? s.slice(0, n) + "..." : s; };

function validateText(text, type, lang) {
  const E = [], add = m => E.push(m);
  text = (text || "").trim();
  if (!text) return { errors: [t("e_empty")] };
  if (text.length > LIMITS.bytes) return { errors: [t("e_big")] };
  if (text.startsWith("```")) {
    const m = text.match(/^```[A-Za-z]*[ \t]*\r?\n([\s\S]*?)\r?\n?```\s*$/);
    if (!m) return { errors: [t("e_fence")] };
    text = m[1].trim();
  }
  if (text[0] !== "{") {
    if (text.includes("{")) return { errors: [t("e_extra") + ' "' + shorten(text.split("\n")[0], 40) + '"'] };
  }
  let o;
  try { o = JSON.parse(text); } catch (e) {
    const errs = [t("e_parse") + " " + shorten(e && e.message, 160)];
    if (/[\u201C\u201D]|\\[\[\]_]/.test(text)) errs.push(t("e_smart"));
    return { errors: errs };
  }
  if (!o || typeof o !== "object" || Array.isArray(o)) return { errors: [t("e_notobj")] };

  if (o.schema_version !== 1) add(t("e_ver"));
  if (o.session_type !== type.sessionType) add(fmt(t("e_st"), type.sessionType));
  if (o.output_type !== type.outputType) add(fmt(t("e_ot"), type.outputType));
  if (o.language !== "en" && o.language !== "fr") add(t("e_langbad"));
  else if (o.language !== lang) add(fmt(t("e_lang"), lang));
  const top = (k, msg) => { if (!isStr(o[k]) || !o[k].trim()) add(msg); else if (o[k].length > LIMITS.str) add(k + " " + t("e_long")); };
  top("title", t("e_title")); top("intro", t("e_introf"));

  const clean = [];
  if (!Array.isArray(o.blocks) || o.blocks.length === 0) add(t("e_blocks"));
  else if (o.blocks.length > LIMITS.blocks) add(fmt(t("e_blocksmax"), LIMITS.blocks));
  else o.blocks.forEach((b, i) => {
    const at = "blocks[" + (i + 1) + "]";
    if (!b || typeof b !== "object" || Array.isArray(b)) return add(at + " " + t("e_bobj"));
    const spec = isStr(b.type) && Object.prototype.hasOwnProperty.call(BLOCK_SPECS, b.type) ? BLOCK_SPECS[b.type] : null;
    if (spec && !type.allowed.includes(b.type)) return add(at + " (" + b.type + ") " + t("e_notallowed") + " " + type.outputType);
    if (!spec) return add(at + " " + t("e_btype") + ' "' + shorten(b.type === undefined ? "" : (isStr(b.type) ? b.type : JSON.stringify(b.type)), 40) + '"');
    const nb = { type: b.type }, p = at + " (" + b.type + ")", before = E.length;
    for (const [k, rule] of Object.entries(spec)) {
      const v = b[k], f = p + ' "' + k + '"';
      if (Array.isArray(rule)) {
        if (!rule.includes(v)) add(f + " " + t("e_enum") + " " + rule.join(", ")); else nb[k] = v;
      } else if (rule === "s" || rule === "s?") {
        if (rule === "s?" && (v === undefined || v === null)) nb[k] = "";
        else if (!isStr(v)) add(f + " " + t(rule === "s" ? "e_text" : "e_opttext"));
        else if (rule === "s" && !v.trim()) add(f + " " + t("e_text"));
        else if (v.length > LIMITS.str) add(f + " " + t("e_long"));
        else nb[k] = v;
      } else if (rule === "a") {
        if (!Array.isArray(v) || !v.length || v.length > LIMITS.items || v.some(x => !isStr(x) || !x.trim() || x.length > LIMITS.str)) add(f + " " + t("e_list"));
        else nb[k] = v.slice();
      } else if (rule === "a?") {
        if (v === undefined || v === null) nb[k] = [];
        else if (!Array.isArray(v) || v.length > LIMITS.items || v.some(x => !isStr(x) || !x.trim() || x.length > LIMITS.str)) add(f + " " + t("e_list"));
        else nb[k] = v.slice();
      } else if (rule === "m") {
        const cols = Array.isArray(b.columns) ? b.columns.length : 0;
        if (!Array.isArray(v) || !v.length || v.length > LIMITS.rows || v.some(r => !Array.isArray(r) || r.some(c => !isStr(c) || c.length > LIMITS.str))) add(f + " " + t("e_matrix"));
        else {
          const bad = v.findIndex(r => r.length !== cols);
          if (cols && bad >= 0) add(p + " " + fmt(t("e_cols"), bad + 1, cols)); else nb[k] = v.map(r => r.slice());
        }
      }
    }
    if (b.type === "survey_question" && E.length === before && (nb.kind === "choice" || nb.kind === "multi") && nb.options.length < 2) add(p + " " + t("e_opts"));
    if (E.length === before) clean.push(nb);
  });
  for (const r of type.requiredBlocks) if (Array.isArray(o.blocks) && !o.blocks.some(b => b && b.type === r)) add(fmt(t("e_need"), r));
  if (E.length) return { errors: E };
  return { errors: [], data: { schema_version: 1, session_type: o.session_type, output_type: o.output_type, language: o.language, title: o.title, intro: o.intro, blocks: clean } };
}

}
function nameField() {
  return el("label", { class: "namef" }, el("span", { class: "muted", style: "display:block;margin:0 0 4px" }, "Name (optional)"),
    el("input", { type: "text", maxlength: "80", value: S.name || "", placeholder: "e.g. Tuesday group at the library", "aria-label": "Name for this saved profile",
      oninput: e => { S.name = e.target.value.slice(0, 80); }, onchange: () => { if (S.sid) persist(); } }));
}
function saveBar() {
  return el("div", { class: "actbar" },
    el("div", { class: "row" },
      el("button", { class: "btn", onclick: () => { if (isDirty()) { S.modal = true; render(); } else goStart(); } }, "← Start"),
      el("button", { class: "btn primary", onclick: saveNow }, "Save")),
    el("div", { class: "muted", role: "status", style: "margin:6px 2px 0;font-size:13px" }, S.saveMsg || (isDirty() ? "Not saved to your library yet." : "Saved to your library.")));
}
function editScreen() {
  const d = S.result;
  const tabs = el("div", { class: "seg dark", role: "group", style: "margin-bottom:12px" },
    [["edit", "tabEdit"], ["preview", "tabPreview"]].map(([id, key]) => el("button", { "aria-pressed": String(S.tab === id), onclick: () => { S.tab = id; render(); window.scrollTo(0, 0); } }, t(key))));
  const body = S.tab === "edit"
    ? [el("p", { class: "muted" }, t("editHint")), el("span", { class: "pill" }, L(currentType().label)),
       el("div", { class: "ed" }, textField(d, "title", t("title")), textField(d, "intro", t("intro"), { long: true })),
       d.blocks.map((b, i) => blockEditor(b, i, d.blocks))]
    : [previewOf(d), exportPanel(d)];
  return shell(saveBar(), nameField(), tabs, body,
    el("button", { class: "btn primary", onclick: saveNow }, "Save to library"),
    currentType().local ? el("button", { class: "btn", onclick: () => { S.screen = "feas"; render(); window.scrollTo(0, 0); } }, "Back to the Feasibility check") : el("button", { class: "btn", onclick: () => { S.screen = "import"; S.errors = []; render(); window.scrollTo(0, 0); } }, t("newImport")),
    el("button", { class: "btn", onclick: () => { S.screen = "hub"; render(); window.scrollTo(0, 0); } }, t("hubBack")),
    currentType().local ? null : el("button", { class: "btn link", onclick: () => { S.screen = "composer"; render(); window.scrollTo(0, 0); } }, t("backPrompt")));
}

function render() {
  document.documentElement.lang = S.ui;
  document.title = BRANDING.appName;
  applyBranding(brandFor(S.brand));
  persist();
  const root = document.getElementById("root");
  if (S.auth.status === "checking") { root.replaceChildren(shell(el("p", { class: "muted", style: "margin-top:40px;text-align:center" }, t("checking")))); return; }
  if (S.auth.status !== "in") { root.replaceChildren(loginScreen()); return; }
  if (!Cloud.started) { Cloud.started = true; setTimeout(() => Cloud.sync(), 300); }
  const screens = { intake: intakeScreen, hub: hubScreen, composer: composerScreen, import: importScreen, edit: editScreen, sessions: sessionsScreen, feas: feasScreen, leads: leadsScreen };
  root.replaceChildren(...[(screens[S.screen] || homeScreen)(), S.modal && S.screen === "edit" ? leaveModal() : null].filter(Boolean));
}

bootAuth();
render();
setInterval(persist, 2500);
addEventListener("pagehide", persist);
document.addEventListener("visibilitychange", () => { if (document.hidden) persist(); });
</script>
</body>
</html>
