<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#11304C">
<title>AI with Robert Toolkit</title>
<style id="appcss">
:root{--navy:#11304C;--blue:#1F77AE;--light:#EAF5FC;--ink:#1c2433;--muted:#5b6678;--line:#d9e2ee}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Helvetica,Arial,sans-serif;color:var(--ink);background:#fff}
header.top{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px}
.hlogo{width:34px;height:34px;background:#fff;border-radius:10px;padding:3px}
.seg{display:flex;border:1px solid rgba(255,255,255,.55);border-radius:999px;overflow:hidden}
.seg button{background:transparent;color:#fff;border:0;padding:8px 14px;font:inherit;font-size:15px;min-height:40px}
.seg button[aria-pressed=true]{background:#fff;color:var(--navy);font-weight:700}
.seg.dark{border-color:var(--blue)}
.seg.dark button{color:var(--navy);flex:1;min-height:48px}
.seg.dark button[aria-pressed=true]{background:var(--blue);color:#fff}
main{padding:16px 16px calc(28px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
h1{color:var(--navy);font-size:26px;line-height:1.2;margin:8px 0 12px}
h2{color:var(--navy);font-size:19px;margin:18px 0 8px}
p{margin:8px 0}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.note{background:var(--light);border-left:5px solid var(--blue);border-radius:12px;padding:12px 14px;margin:14px 0;font-size:15px}
.note.warn{background:#FFF6E0;border-left-color:#E0A100}
.btn{display:block;width:100%;min-height:56px;border-radius:14px;border:2px solid var(--blue);background:#fff;color:var(--navy);font:inherit;font-weight:700;margin:10px 0;padding:12px 16px;text-align:center}
.btn.primary{background:var(--blue);color:#fff}
.btn.link{border-color:transparent;font-weight:600;color:var(--blue)}
.btn:disabled{opacity:.4}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;text-align:left;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font:inherit;padding:10px 14px;margin:8px 0}
.opt[aria-pressed=true]{border-color:var(--blue);background:var(--light);font-weight:600}
.opt .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--blue);background:#fff}
.opt.multi .dot{border-radius:6px}
.opt[aria-pressed=true] .dot{background:var(--blue);box-shadow:inset 0 0 0 4px #fff}
.opt small{display:block;color:var(--muted);font-weight:400}
input,textarea{font:inherit;font-size:17px;width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;color:var(--ink)}
textarea{min-height:140px;resize:vertical}
.pill{display:inline-block;background:var(--light);color:var(--navy);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700}
.bar{height:8px;background:var(--light);border-radius:99px;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.muted{color:var(--muted);font-size:15px}
pre.prompt,pre.fmt{white-space:pre-wrap;word-break:break-word;background:#f5f8fc;border:1px solid var(--line);border-radius:12px;padding:12px;font:13px/1.45 ui-monospace,Menlo,monospace;-webkit-user-select:text;user-select:text;margin:8px 0}
pre.prompt{max-height:42vh;overflow:auto}
details{border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin:12px 0}
summary{min-height:48px;display:flex;align-items:center;font-weight:700;color:var(--navy)}
ol.how{padding-left:22px;margin:8px 0}
footer{color:var(--muted);font-size:13px;text-align:center;margin-top:28px}
.btn.sm{min-height:44px;width:auto;display:inline-block;margin:4px 6px 4px 0;padding:6px 14px;font-size:15px}
.btn.danger{border-color:#B3261E;color:#B3261E}
.err{background:#FDECEA;border-left:5px solid #B3261E;border-radius:12px;padding:12px 14px;margin:14px 0;font-size:15px}
.err ul{margin:6px 0 0;padding-left:20px}
.ed{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:14px 0}
.ed label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.03em}
.ed textarea{min-height:90px}
.ed .grid{display:grid;gap:6px;margin:6px 0}
.ed .grid input{padding:8px;font-size:16px;min-width:0}
.doc{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.doc .hero{background:var(--navy);color:#fff;padding:20px 18px}
.doc .hero h1{color:#fff;margin:8px 0 6px}
.doc .hero p{margin:0;white-space:pre-line}
.doc .htop{display:flex;align-items:center;gap:12px}
.doc .logo{width:64px;height:64px;flex:none;background:#fff;border-radius:16px;padding:6px}
.doc .bname{font-weight:800;font-size:19px;color:#fff;line-height:1.2}
.doc .hero h1{margin-top:16px}
.doc .dbody{padding:6px 16px 12px}
.doc .blk{margin:20px 0}
.doc h3{color:var(--navy);font-size:20px;margin:0 0 8px}
.doc .txt{white-space:pre-line}
.doc ol.st{padding:0;list-style:none;counter-reset:n;margin:6px 0}
.doc ol.st li{counter-increment:n;display:flex;gap:10px;margin:10px 0;align-items:flex-start}
.doc ol.st li::before{content:counter(n);flex:none;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.doc .tw{overflow-x:auto}
.doc table{border-collapse:collapse;width:100%;font-size:15px}
.doc th{background:var(--navy);color:#fff;text-align:left;padding:8px}
.doc td{border:1px solid var(--line);padding:8px;vertical-align:top}
.doc .tryit{background:var(--light);border:2px dashed var(--blue);border-radius:14px;padding:12px 14px}
.doc .tryit .p{font-weight:600;color:var(--navy);white-space:pre-wrap;margin-top:8px}
.doc .box{border-radius:12px;padding:12px 14px;border-left:5px solid var(--blue);background:var(--light);white-space:pre-line}
.doc .box.safety{background:#FFF6E0;border-left-color:#E0A100}
.doc .box ul{margin:4px 0;padding-left:20px;white-space:normal}
.doc .card2{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.doc .lbl{font-size:13px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.03em;margin-top:8px}
.doc .disc{font-size:14px;font-style:italic;color:var(--muted);white-space:pre-line}
@media print{header.top,.seg,.card,.note,.btn,footer,.muted{display:none!important}.doc{border:0}.doc .hero,.doc th,.doc ol.st li::before{-webkit-print-color-adjust:exact;print-color-adjust:exact}.doc .blk{break-inside:avoid}}
.doc .foot div+div{margin-top:2px;color:var(--navy);font-weight:600}
.doc .foot{border-top:1px solid var(--line);padding:10px 16px;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>

/* Safe DOM builder: strings are always text nodes, never HTML. */
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "disabled") n.disabled = !!v;
    else if (v === true) n.setAttribute(k, "");
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
}

function optLabel(q, id) { const o = (q.options || []).find(x => x.id === id); return o ? o.en : ""; }

    title: "Your First AI Conversation",
    intro: "2-3 sentence welcome or summary",
    blocks: [

      { type: "practice_prompt", heading: "Try it now", prompt: "Explain [topic] like I'm new to it.", note: "Swap [topic] for anything." },
      { type: "workflow", heading: "Reusable workflow", purpose: "What this workflow is for", steps: ["Step 1", "Step 2"], reuse: "How and when to reuse it" },

function buildPrompt(type, lang, answers) {
  const langName = lang === "fr" ? 'Quebec professional French ("fr")' : 'English ("en")';
  const intake = type.questions.map(q => {
    let v = answers[q.id];
    if (q.type === "choice") v = optLabel(q, v);
    else if (q.type === "multi") v = (v || []).map(id => optLabel(q, id)).join(", ");
    v = (v == null ? "" : String(v)).trim();
    return v ? "- " + q.promptLabel + ": " + v : null;
  }).filter(Boolean).join("\n");
  const blockList = Object.entries(BLOCK_TYPES).map(([k, b]) => '- "' + k + '": ' + b.fields).join("\n");
  const req = type.requiredBlocks.map(b => '"' + b + '"').join(", ");
  return [
    "You are helping " + BRANDING.owner + " (" + brandFor(type.sessionType).name + ") prepare a client deliverable for an AI training session.",
    "",
    "RULES",
    "- Use ONLY the intake information below. Never invent facts about the client.",
    ...type.audienceRules.map(r => "- " + r),
    "- Write every text value in " + langName + ".",
    '- Set "schema_version" to 1, "session_type" to exactly "' + type.sessionType + '", "output_type" to exactly "' + type.outputType + '", and "language" to exactly "' + lang + '".',
    "- Required: at least one block of each of these types: " + req + ". Every other block type is optional. Blocks may appear in any order and any number.",
    "- Every string must be plain text: no HTML, no markdown, no emoji.",
    "- Reply with ONLY one JSON object, placed inside a single code block so it can be copied exactly. No commentary before or after the code block.",
    '- Use straight double quotes (") for all JSON syntax, never curly quotes, and do not add backslashes.',
    "",
    "INTAKE",
    intake,
    "",
    "BLOCK TYPES (each block is an object with a \"type\" field plus these fields)",
    blockList,
    "",
    "EXACT JSON FORMAT (example values only - replace them with real content):",
    exampleJson(type, lang)
  ].join("\n");
}

/* ---- Clipboard ---------------------------------------------------------- */
async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); return true; }
  catch (e) {
    const ta = el("textarea", { readonly: true, style: "position:fixed;top:0;opacity:0" });
    ta.value = txt; document.body.append(ta); ta.focus(); ta.select();
    try { ta.setSelectionRange(0, txt.length); } catch (_) {}
    let ok = false; try { ok = document.execCommand("copy"); } catch (_) {}
    ta.remove(); return ok;
  }
}

/* ---- Auth ---------------------------------------------------------------- */
const Auth = {
  load() { try { return JSON.parse(localStorage.getItem(AUTH.storageKey) || "null"); } catch (e) { return null; } },
  save(v) { try { localStorage.setItem(AUTH.storageKey, JSON.stringify(v)); } catch (e) {} },
  clear() { try { localStorage.removeItem(AUTH.storageKey); } catch (e) {} },
  async api(path, body, token) {
    const c = new AbortController(), to = setTimeout(() => c.abort(), 12000);
    try {
      const r = await fetch(AUTH.url + path, { method: "POST", body: JSON.stringify(body), signal: c.signal,
        headers: Object.assign({ apikey: AUTH.key, "Content-Type": "application/json" }, token ? { Authorization: "Bearer " + token } : {}) });
      let j = null; try { j = await r.json(); } catch (e) {}
      return { ok: r.ok, status: r.status, json: j };
    } finally { clearTimeout(to); }
  },
  /* true / false / "expired"; throws on network failure */
  async hasAccess(token) {
    const r = await Auth.api("/rest/v1/rpc/has_app_access", { app_name: AUTH.app }, token);
    if (r.ok) return r.json === true;
    return r.status === 401 ? "expired" : "error";
  },
  mk(j, email, verified) {
    return { access: j.access_token, refresh: j.refresh_token, expires: Date.now() + (j.expires_in || 3600) * 1000, email: email || (j.user && j.user.email) || "", verified };
  },
  async signIn(email, pw) {
    let r; try { r = await Auth.api("/auth/v1/token?grant_type=password", { email, password: pw }); } catch (e) { return "offline"; }
    if (!r.ok) return r.status >= 500 ? "error" : "wrong";
    let ok; try { ok = await Auth.hasAccess(r.json.access_token); } catch (e) { return "offline"; }
    if (ok !== true) return ok === false ? "noaccess" : "error";
    Auth.save(Auth.mk(r.json, email, Date.now())); return "ok";
  },
  /* re-check a stored session: ok / offline / noaccess / revoked / error */
  async verify() {
    const s = Auth.load(); if (!s) return "revoked";
    try {
      const refresh = async () => {
        const r = await Auth.api("/auth/v1/token?grant_type=refresh_token", { refresh_token: s.refresh });
        if (!r.ok) return r.status >= 500 ? "error" : "revoked";
        Object.assign(s, Auth.mk(r.json, s.email, s.verified)); return "ok";
      };
      if (s.expires < Date.now() + 60000) { const x = await refresh(); if (x !== "ok") { if (x === "revoked") Auth.clear(); return x; } }
      let ok = await Auth.hasAccess(s.access);
      if (ok === "expired") { const x = await refresh(); if (x !== "ok") { if (x === "revoked") Auth.clear(); return x; } ok = await Auth.hasAccess(s.access); }
      if (ok === true) { s.verified = Date.now(); Auth.save(s); return "ok"; }
      if (ok === false) { Auth.clear(); return "noaccess"; }
      return "error";
    } catch (e) { return "offline"; }
  }
};
const A_MSG = { wrong: "a_wrong", noaccess: "a_noaccess", offline: "a_offline", revoked: "a_revoked", error: "a_error" };
function applyVerify(res) {
  if (res === "ok") { const s = Auth.load(); S.auth = { status: "in", msg: "", email: s ? s.email : "", busy: false }; }
  else S.auth = { status: "out", msg: res, email: "", busy: false };
  render();
}
function bootAuth() {
  const s = Auth.load();
  S.auth = { status: s ? "checking" : "out", msg: "", email: s ? s.email : "", busy: false };
  if (s) Auth.verify().then(applyVerify);
  window.addEventListener("online", () => { if (Auth.load() && S.auth.status === "out") { S.auth.status = "checking"; render(); Auth.verify().then(applyVerify); } });
}
function signOut() { Auth.clear(); S.auth = { status: "out", msg: "", email: "", busy: false }; render(); }

  if (q.type === "multi") return Array.isArray(v) && v.length > 0;
  return v != null && String(v).trim() !== "";
}

function intakeScreen() {

    el("h1", null, L(q.label)),

/* ---- Validation (AI output is untrusted: parse, check, rebuild clean) ---- */
function fmt(s, ...a) { let i = 0; return s.replace(/%s/g, () => a[i++]); }
const isStr = v => typeof v === "string";
const shorten = (s, n) => { s = String(s); return s.length > n ? s.slice(0, n) + "..." : s; };

function validateText(text, type, lang) {
  const E = [], add = m => E.push(m);
  text = (text || "").trim();
  if (!text) return { errors: [t("e_empty")] };
  if (text.length > LIMITS.bytes) return { errors: [t("e_big")] };
  if (text.startsWith("```")) {
    const m = text.match(/^```[A-Za-z]*[ \t]*\r?\n([\s\S]*?)\r?\n?```\s*$/);
    if (!m) return { errors: [t("e_fence")] };
    text = m[1].trim();
  }
  if (text[0] !== "{") {
    if (text.includes("{")) return { errors: [t("e_extra") + ' "' + shorten(text.split("\n")[0], 40) + '"'] };
  }
  let o;
  try { o = JSON.parse(text); } catch (e) {
    const errs = [t("e_parse") + " " + shorten(e && e.message, 160)];
    if (/[\u201C\u201D]|\\[\[\]_]/.test(text)) errs.push(t("e_smart"));
    return { errors: errs };
  }
  if (!o || typeof o !== "object" || Array.isArray(o)) return { errors: [t("e_notobj")] };

  if (o.schema_version !== 1) add(t("e_ver"));
  if (o.session_type !== type.sessionType) add(fmt(t("e_st"), type.sessionType));
  if (o.output_type !== type.outputType) add(fmt(t("e_ot"), type.outputType));
  if (o.language !== "en" && o.language !== "fr") add(t("e_langbad"));
  else if (o.language !== lang) add(fmt(t("e_lang"), lang));
  const top = (k, msg) => { if (!isStr(o[k]) || !o[k].trim()) add(msg); else if (o[k].length > LIMITS.str) add(k + " " + t("e_long")); };
  top("title", t("e_title")); top("intro", t("e_introf"));

  const clean = [];
  if (!Array.isArray(o.blocks) || o.blocks.length === 0) add(t("e_blocks"));
  else if (o.blocks.length > LIMITS.blocks) add(fmt(t("e_blocksmax"), LIMITS.blocks));
  else o.blocks.forEach((b, i) => {
    const at = "blocks[" + (i + 1) + "]";
    if (!b || typeof b !== "object" || Array.isArray(b)) return add(at + " " + t("e_bobj"));
    const spec = isStr(b.type) && Object.prototype.hasOwnProperty.call(BLOCK_SPECS, b.type) ? BLOCK_SPECS[b.type] : null;
    if (!spec) return add(at + " " + t("e_btype") + ' "' + shorten(b.type === undefined ? "" : (isStr(b.type) ? b.type : JSON.stringify(b.type)), 40) + '"');
    const nb = { type: b.type }, p = at + " (" + b.type + ")", before = E.length;
    for (const [k, rule] of Object.entries(spec)) {
      const v = b[k], f = p + ' "' + k + '"';
      if (Array.isArray(rule)) {
        if (!rule.includes(v)) add(f + " " + t("e_enum") + " " + rule.join(", ")); else nb[k] = v;
      } else if (rule === "s" || rule === "s?") {
        if (rule === "s?" && (v === undefined || v === null)) nb[k] = "";
        else if (!isStr(v)) add(f + " " + t(rule === "s" ? "e_text" : "e_opttext"));
        else if (rule === "s" && !v.trim()) add(f + " " + t("e_text"));
        else if (v.length > LIMITS.str) add(f + " " + t("e_long"));
        else nb[k] = v;
      } else if (rule === "a") {
        if (!Array.isArray(v) || !v.length || v.length > LIMITS.items || v.some(x => !isStr(x) || !x.trim() || x.length > LIMITS.str)) add(f + " " + t("e_list"));
        else nb[k] = v.slice();
      } else if (rule === "m") {
        const cols = Array.isArray(b.columns) ? b.columns.length : 0;
        if (!Array.isArray(v) || !v.length || v.length > LIMITS.rows || v.some(r => !Array.isArray(r) || r.some(c => !isStr(c) || c.length > LIMITS.str))) add(f + " " + t("e_matrix"));
        else {
          const bad = v.findIndex(r => r.length !== cols);
          if (cols && bad >= 0) add(p + " " + fmt(t("e_cols"), bad + 1, cols)); else nb[k] = v.map(r => r.slice());
        }
      }
    }
    if (E.length === before) clean.push(nb);
  });
  for (const r of type.requiredBlocks) if (Array.isArray(o.blocks) && !o.blocks.some(b => b && b.type === r)) add(fmt(t("e_need"), r));
  if (E.length) return { errors: E };
  return { errors: [], data: { schema_version: 1, session_type: o.session_type, output_type: o.output_type, language: o.language, title: o.title, intro: o.intro, blocks: clean } };
}

/* ---- Deliverable renderer (text nodes only - nothing is ever parsed as HTML) ---- */

  fr: { tryIt: "À vous d'essayer", tip: "Astuce", safety: "Sécurité", workflow: "Flux de travail", purpose: "À quoi ça sert", reuse: "Comment le réutiliser", next: "Prochaines étapes" }
};

      case "steps": return el("div", { class: "blk" }, el("h3", null, b.heading), el("ol", { class: "st" }, b.items.map(x => el("li", null, el("span", null, x)))));
      case "comparison_table": return el("div", { class: "blk" }, el("h3", null, b.heading), el("div", { class: "tw" }, el("table", null,
        el("thead", null, el("tr", null, b.columns.map(c => el("th", null, c)))),
        el("tbody", null, b.rows.map(r => el("tr", null, r.map(c => el("td", null, c))))))));
      case "practice_prompt": return el("div", { class: "blk" }, el("h3", null, b.heading), el("div", { class: "tryit" },
        el("span", { class: "pill" }, l.tryIt), el("div", { class: "p" }, b.prompt), b.note ? el("div", { class: "muted", style: "margin-top:6px" }, b.note) : null));
      case "workflow": return el("div", { class: "blk" }, el("div", { class: "card2" }, el("span", { class: "pill" }, l.workflow), el("h3", { style: "margin-top:8px" }, b.heading),
        el("div", { class: "lbl" }, l.purpose), el("div", { class: "txt" }, b.purpose), el("ol", { class: "st" }, b.steps.map(x => el("li", null, el("span", null, x)))),
        el("div", { class: "lbl" }, l.reuse), el("div", { class: "txt" }, b.reuse)));
      case "tip": return el("div", { class: "blk" }, el("div", { class: "box" + (b.style === "safety" ? " safety" : "") }, el("b", null, b.style === "safety" ? l.safety : l.tip), ": ", b.body));
      case "cheat_sheet": return el("div", { class: "blk" }, el("h3", null, b.heading), el("div", { class: "box" }, ul(b.items)));
      case "next_steps": return el("div", { class: "blk" }, el("h3", null, l.next), ul(b.items));

  });
  return el("article", { class: "doc" },
    el("div", { class: "hero" }, el("div", { class: "htop" }, el("img", { class: "logo", src: brand.logo, alt: "" }), el("div", { class: "bname" }, brand.name)), el("h1", null, d.title), el("p", null, d.intro)),
    el("div", { class: "dbody" }, blocks), el("div", { class: "foot" }, el("div", null, brand.line1), el("div", null, brand.line2)));
}

/* ---- Export ------------------------------------------------------------- */
const STANDALONE_CSS = "body{margin:0 auto;padding:12px;max-width:760px}@page{margin:14mm}";
function slug(s) { return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 50) || "handout"; }
function standaloneHtml(d) {
  const doc = document.implementation.createHTMLDocument(d.title);
  doc.documentElement.setAttribute("lang", d.language);
  const meta = doc.createElement("meta"); meta.setAttribute("charset", "utf-8"); doc.head.prepend(meta);
  const vp = doc.createElement("meta"); vp.setAttribute("name", "viewport"); vp.setAttribute("content", "width=device-width, initial-scale=1"); doc.head.append(vp);
  const c = brandFor(d.session_type).colors, st = doc.createElement("style");
  st.textContent = ":root{--navy:" + c.navy + ";--blue:" + c.blue + ";--light:" + c.light + ";--sky:" + c.sky + "}" + document.getElementById("appcss").textContent.replace(/^:root\{[^}]*\}/m, "") + STANDALONE_CSS;
  doc.head.append(st);
  doc.body.append(doc.importNode(renderDeliverable(d), true));
  return "<!DOCTYPE html>\n" + doc.documentElement.outerHTML;
}
function plainText(d) {
  const l = DOC_L[d.language] || DOC_L.en, o = [d.title, "", d.intro, ""];
  const list = (a, num) => a.map((x, i) => (num ? (i + 1) + ". " : "- ") + x);
  d.blocks.forEach(b => {
    switch (b.type) {
      case "section": o.push(b.heading, b.body); break;
      case "steps": o.push(b.heading, ...list(b.items, true)); break;
      case "comparison_table": o.push(b.heading, b.columns.join(" | "), ...b.rows.map(r => r.join(" | "))); break;
      case "practice_prompt": o.push(l.tryIt + ": " + b.heading, b.prompt); if (b.note) o.push(b.note); break;
      case "workflow": o.push(l.workflow + ": " + b.heading, b.purpose, ...list(b.steps, true), l.reuse + ": " + b.reuse); break;
      case "tip": o.push((b.style === "safety" ? l.safety : l.tip) + ": " + b.body); break;
      case "cheat_sheet": o.push(b.heading, ...list(b.items)); break;
      case "next_steps": o.push(l.next, ...list(b.items)); break;
      case "disclaimer": o.push(b.body); break;
    }
    o.push("");
  });
  o.push(brandFor(d.session_type).line1, brandFor(d.session_type).line2);
  return o.join("\n");
}
let blobUrl = null;
function exportPanel(d) {
  const html = standaloneHtml(d), name = slug(d.title) + "-" + d.language + ".html";
  const blob = new Blob([html], { type: "text/html" });
  if (blobUrl) URL.revokeObjectURL(blobUrl);
  blobUrl = URL.createObjectURL(blob);
  const msg = el("p", { class: "muted", role: "status" });
  const share = el("button", { class: "btn primary", onclick: async () => {
    try {
      const f = new File([blob], name, { type: "text/html" });
      if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: d.title }); msg.textContent = t("shared"); }
      else msg.textContent = t("shareFail");
    } catch (e) { if (!e || e.name !== "AbortError") msg.textContent = t("shareFail"); }
  } }, t("shareFile"));
  const copy = el("button", { class: "btn", onclick: async () => { msg.textContent = (await copyText(plainText(d))) ? t("textCopied") : t("copyFail"); } }, t("copyText"));
  return el("div", { class: "card" }, el("h2", { style: "margin-top:0" }, t("exportTitle")),
    share,
    el("a", { class: "btn", href: blobUrl, download: name, style: "text-decoration:none;line-height:30px" }, t("downloadFile")),
    el("a", { class: "btn", href: blobUrl, target: "_blank", rel: "noopener", style: "text-decoration:none;line-height:30px" }, t("openPage")),
    el("button", { class: "btn", onclick: () => { try { window.print(); } catch (e) { msg.textContent = t("shareFail"); } } }, t("printBtn")),
    copy, msg, el("div", { class: "note" }, t("pdfHelp")));
}

/* ---- Import screen ------------------------------------------------------- */
function runValidation(text) {
  const type = currentType();
  const r = validateText(text, type, S.lang);
  if (r.errors.length) { S.errors = r.errors; S.result = null; }
  else { S.errors = []; S.result = r.data; S.tab = "edit"; S.screen = "edit"; }
  render(); window.scrollTo(0, 0);
}

function importScreen() {
  const ta = el("textarea", { placeholder: t("pastePh"), "aria-label": t("pastePh"), style: "min-height:220px;font:14px/1.4 ui-monospace,Menlo,monospace", autocapitalize: "off", autocorrect: "off", spellcheck: "false", oninput: e => { S.paste = e.target.value; } });
  ta.value = S.paste;
  const file = el("input", { type: "file", accept: ".json,.txt,application/json,text/plain", style: "display:none", onchange: e => {
    const f = e.target.files && e.target.files[0]; e.target.value = "";
    if (!f) return;
    if (f.size > LIMITS.bytes) { S.errors = [t("e_big")]; render(); return; }
    const fr = new FileReader();
    fr.onerror = () => { S.errors = [t("e_parse") + " " + shorten(fr.error && fr.error.message, 100)]; render(); };
    fr.onload = () => { S.paste = String(fr.result || ""); runValidation(S.paste); };
    fr.readAsText(f);
  } });
  const shown = S.errors.slice(0, 12);
  return shell(
    el("h1", null, t("importTitle")), el("p", { class: "muted" }, t("importSub")),
    S.errors.length ? el("div", { class: "err", role: "alert" }, el("b", null, t("problems")),
      el("ul", null, shown.map(x => el("li", null, x))),
      S.errors.length > 12 ? el("div", null, "+" + (S.errors.length - 12) + " " + t("moreErrs")) : null) : null,
    ta,
    el("button", { class: "btn primary", onclick: () => runValidation(S.paste) }, t("validate")),
    file, el("button", { class: "btn", onclick: () => file.click() }, t("importFile")),
    el("button", { class: "btn link", onclick: () => { S.screen = "composer"; render(); window.scrollTo(0, 0); } }, t("backPrompt")));
}

/* ---- Edit + preview screen ---------------------------------------------- */
function textField(obj, key, label, opts) {
  opts = opts || {};
  const inp = opts.long ? el("textarea", { oninput: e => { obj[key] = e.target.value; } }) : el("input", { type: "text", oninput: e => { obj[key] = e.target.value; } });
  inp.value = obj[key] || "";
  return el("div", null, el("label", null, label), inp);
}
function listField(obj, key, label) {
  const ta = el("textarea", { oninput: e => { obj[key] = e.target.value.split("\n").map(s => s.trim()).filter(Boolean); } });
  ta.value = (obj[key] || []).join("\n");
  return el("div", null, el("label", null, label), ta);
}
function tableField(b) {
  const wrap = el("div");
  const build = () => {
    const n = b.columns.length, tpl = "grid-template-columns:repeat(" + n + ",minmax(0,1fr))";
    const cell = (arr, i) => { const x = el("input", { type: "text", oninput: e => { arr[i] = e.target.value; } }); x.value = arr[i] || ""; return x; };
    wrap.replaceChildren(
      el("label", null, "columns"), el("div", { class: "grid", style: tpl }, b.columns.map((_, i) => cell(b.columns, i))),
      el("label", null, "rows"),
      b.rows.map((r, ri) => el("div", null, el("div", { class: "grid", style: tpl }, r.map((_, ci) => cell(r, ci))),
        el("button", { class: "btn sm danger", disabled: b.rows.length < 2, onclick: () => { b.rows.splice(ri, 1); build(); } }, t("removeRow")))),
      el("button", { class: "btn sm", onclick: () => { b.rows.push(b.columns.map(() => "")); build(); } }, t("addRow")));
  };
  build();
  return wrap;
}
function blockEditor(b, i, all) {
  const spec = BLOCK_SPECS[b.type], fields = [];
  for (const [k, rule] of Object.entries(spec)) {
    if (Array.isArray(rule)) {
      const sel = el("select", { style: "font:inherit;font-size:17px;padding:10px;border-radius:12px;border:2px solid var(--line);width:100%", onchange: e => { b[k] = e.target.value; } },
        rule.map(v => el("option", { value: v }, v)));
      sel.value = b[k]; fields.push(el("div", null, el("label", null, k), sel));
    } else if (rule === "a") fields.push(listField(b, k, k));
    else if (rule === "m") fields.push(tableField(b));
    else fields.push(textField(b, k, k, { long: !["heading"].includes(k) }));
  }
  const mv = d => () => { const j = i + d; if (j < 0 || j >= all.length) return; [all[i], all[j]] = [all[j], all[i]]; render(); };
  return el("div", { class: "ed" },
    el("span", { class: "pill" }, (i + 1) + ". " + L(BLOCK_LABELS[b.type])), fields,
    el("div", { style: "margin-top:10px" },
      el("button", { class: "btn sm", disabled: i === 0, onclick: mv(-1) }, t("up")),
      el("button", { class: "btn sm", disabled: i === all.length - 1, onclick: mv(1) }, t("down")),
      el("button", { class: "btn sm danger", onclick: () => { if (confirm(t("confirmRemove"))) { all.splice(i, 1); render(); } } }, t("remove"))));
}
function editScreen() {
  const d = S.result;
  const tabs = el("div", { class: "seg dark", role: "group", style: "margin-bottom:12px" },
    [["edit", "tabEdit"], ["preview", "tabPreview"]].map(([id, key]) => el("button", { "aria-pressed": String(S.tab === id), onclick: () => { S.tab = id; render(); window.scrollTo(0, 0); } }, t(key))));
  const body = S.tab === "edit"
    ? [el("p", { class: "muted" }, t("editHint")),
       el("div", { class: "ed" }, textField(d, "title", t("title")), textField(d, "intro", t("intro"), { long: true })),
       d.blocks.map((b, i) => blockEditor(b, i, d.blocks))]
    : [renderDeliverable(d), exportPanel(d)];
  return shell(tabs, body,
    el("button", { class: "btn", onclick: () => { S.screen = "import"; S.errors = []; render(); window.scrollTo(0, 0); } }, t("newImport")),
    el("button", { class: "btn link", onclick: () => { S.screen = "composer"; render(); window.scrollTo(0, 0); } }, t("backPrompt")));
}

function render() {
  document.documentElement.lang = S.ui;
  document.title = BRANDING.appName;
  applyBranding(brandFor(currentType().sessionType));
  const root = document.getElementById("root");
  if (S.auth.status === "checking") { root.replaceChildren(shell(el("p", { class: "muted", style: "margin-top:40px;text-align:center" }, t("checking")))); return; }
  if (S.auth.status !== "in") { root.replaceChildren(loginScreen()); return; }
  const screens = { intake: intakeScreen, composer: composerScreen, import: importScreen, edit: editScreen };
  root.replaceChildren((screens[S.screen] || homeScreen)());
}

bootAuth();
render();
