<style id="appcss">

*{box-sizing:border-box}

.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px;flex:1;min-width:0}header.top{gap:10px}.hlogo.br{flex:none}
.hlogo{width:34px;height:34px;background:#fff;border-radius:10px;padding:3px}
.seg{display:flex;border:1px solid rgba(255,255,255,.55);border-radius:999px;overflow:hidden}
.seg button{background:transparent;color:#fff;border:0;padding:8px 14px;font:inherit;font-size:15px;min-height:40px}

main{padding:16px 16px calc(28px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}

p{margin:8px 0}

.note.warn{background:#FFF1EB;border-left-color:#C2410C}
.btn{display:block;width:100%;min-height:56px;border-radius:14px;border:2px solid var(--blue);background:#fff;color:var(--navy);font:inherit;font-weight:700;margin:10px 0;padding:12px 16px;text-align:center}

.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;text-align:left;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font:inherit;padding:10px 14px;margin:8px 0}
.opt[aria-pressed=true]{border-color:var(--blue);background:var(--light);font-weight:600}
.opt .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--blue);background:#fff}

.opt small{display:block;color:var(--muted);font-weight:400}
header.top{border-bottom:6px solid var(--blue)}
.bpill{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;background:var(--blue);color:var(--onblue);font-size:11px;font-weight:800;letter-spacing:.6px;vertical-align:middle}
.bsw{margin:4px 0 14px}.bsw h2{margin:0 0 2px;font-size:18px}.bsw .sub{margin:0 0 8px;color:var(--muted);font-size:14px}
.bswg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bswb{position:relative;text-align:left;border:3px solid #cfd6df;border-radius:16px;background:#fff;color:var(--ink);font:inherit;padding:12px 12px 14px;min-height:112px;opacity:.9}

.bswb .bsel{position:absolute;top:8px;right:8px;font-size:11px;font-weight:800;letter-spacing:.6px;background:#fff;color:#11304C;border-radius:999px;padding:2px 8px}
.bnd{margin-top:10px;border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.4}

.sech{margin:26px 0 8px;padding-top:12px;border-top:2px solid var(--line)}.sech h2{margin:0;font-size:19px;color:var(--navy)}.sech p{margin:2px 0 0;font-size:14px}
.pls{display:flex;gap:12px;position:relative}.pnum{flex:none;width:32px;height:32px;border-radius:50%;background:var(--blue);color:var(--onblue);font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:10px;z-index:1}
.pls:not(.last)::before{content:"";position:absolute;left:15px;top:42px;bottom:-10px;width:2px;background:var(--blue);opacity:.45}
.pbody{flex:1;min-width:0}.phint{margin:-4px 2px 12px;font-size:13px;color:var(--muted);line-height:1.35}

input[type=date]{box-sizing:border-box;max-width:100%;min-width:0;min-height:50px;-webkit-appearance:none;appearance:none;background:#fff;text-align:left}
input,textarea{font:inherit;font-size:17px;width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;color:var(--ink)}
textarea{min-height:140px;resize:vertical}
.pill{display:inline-block;background:var(--light);color:var(--navy);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700}
.bar{height:8px;background:var(--light);border-radius:99px;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.muted{color:var(--muted);font-size:15px}
pre.prompt,pre.fmt{white-space:pre-wrap;word-break:break-word;background:#f5f8fc;border:1px solid var(--line);border-radius:12px;padding:12px;font:13px/1.45 ui-monospace,Menlo,monospace;-webkit-user-select:text;user-select:text;margin:8px 0}
pre.prompt{max-height:42vh;overflow:auto}
details{border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin:12px 0}
summary{min-height:48px;display:flex;align-items:center;font-weight:700;color:var(--navy)}
ol.how{padding-left:22px;margin:8px 0}
footer{color:var(--muted);font-size:13px;text-align:center;margin-top:28px}
.prow{display:flex;gap:10px;align-items:center}.prow .btn{flex:1;margin:10px 0;line-height:30px}.ibtn{flex:none;width:56px;height:56px;border-radius:50%;border:2px solid var(--blue);background:#fff;color:var(--navy);font:italic 700 26px Georgia,serif;padding:0}
.btn.sm{min-height:44px;width:auto;display:inline-block;margin:4px 6px 4px 0;padding:6px 14px;font-size:15px}
.btn.danger{border-color:#B3261E;color:#B3261E}
.err{background:#FDECEA;border-left:5px solid #B3261E;border-radius:12px;padding:12px 14px;margin:14px 0;font-size:15px}
.err ul{margin:6px 0 0;padding-left:20px}
.ed{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:14px 0}
.ed label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.03em}
.ed textarea{min-height:90px}
.ed .grid{display:grid;gap:6px;margin:6px 0}

.doc{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.doc .hero{background:var(--navy);color:#fff;padding:20px 18px}
.doc .hero h1{color:#fff;margin:8px 0 6px}

.doc .hero h1{margin-top:16px}
.doc .dbody{padding:6px 16px 12px}
.doc .blk{margin:20px 0}
.doc h3{color:var(--navy);font-size:20px;margin:0 0 8px}
.doc .txt{white-space:pre-line}
.doc ol.st{padding:0;list-style:none;counter-reset:n;margin:6px 0}
.doc ol.st li{counter-increment:n;display:flex;gap:10px;margin:10px 0;align-items:flex-start}
.doc ol.st li::before{content:counter(n);flex:none;width:30px;height:30px;border-radius:50%;background:var(--blue);color:var(--onblue);font-weight:700;display:flex;align-items:center;justify-content:center}
.doc .tw{overflow-x:auto}
.doc table{border-collapse:collapse;width:100%;font-size:15px}
.doc th{background:var(--navy);color:#fff;text-align:left;padding:8px}
.doc td{border:1px solid var(--line);padding:8px;vertical-align:top}
.doc .tryit{background:var(--light);border:2px dashed var(--blue);border-radius:14px;padding:12px 14px}

.doc .box ul{margin:4px 0;padding-left:20px;white-space:normal}
.doc .card2{border:1px solid var(--line);border-radius:14px;padding:12px 14px}

.doc .wl{border-bottom:1.5px solid #9fb0c3;height:34px}.doc .fi{margin:12px 0 4px}.doc .wbox{border:1.5px solid #9fb0c3;border-radius:10px;min-height:130px;margin-top:8px}
.doc .scale{display:flex;gap:10px;margin:10px 0 4px}.doc .sc{flex:1;max-width:56px;height:44px;border:2px solid var(--navy);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--navy)}
.doc .scl{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}.doc .ck{display:flex;align-items:center;gap:10px;margin:8px 0}.doc .bx{flex:none;width:22px;height:22px;border:2px solid var(--navy);border-radius:50%}.doc .bx.sq2{border-radius:5px}.doc .sq{break-inside:avoid}
.pv .sl{margin:12px 0}.pv .nt{display:block;position:absolute;left:0;right:0;bottom:0;background:rgba(17,48,76,.88);color:#fff;font-size:1.7cqw;padding:1cqw 3cqw;z-index:2}
.deck,.pv{counter-reset:sl}
.sl{counter-increment:sl;container-type:inline-size;position:relative;width:100%;aspect-ratio:16/9;background:#fff;color:#1b2a3a;display:flex;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.2);border-radius:6px;text-align:left}
.sl .bar2{position:absolute;left:0;top:0;bottom:0;width:1.6cqw;background:var(--blue)}
.sl .si{flex:1;min-width:0;padding:5cqw 7cqw 7cqw 8cqw;display:flex;flex-direction:column;justify-content:center}
.sl h1{color:#fff;font-size:6.2cqw;line-height:1.12;margin:2cqw 0 2cqw}.sl h2{color:var(--navy);font-size:4.6cqw;line-height:1.15;margin:0 0 3cqw}

.sl p{margin:0}.sl p.big{font-size:3.5cqw;line-height:1.45}.sl p.snote{font-size:2.4cqw;line-height:1.4;color:#4a5a6b;margin-top:2cqw}
.sl .tag{align-self:flex-start;background:var(--light);color:var(--navy);border-radius:999px;padding:.5cqw 2cqw;font-size:2cqw;font-weight:700;margin-bottom:2cqw}
.sl .pbox{background:var(--light);border-left:1cqw solid var(--blue);border-radius:1cqw;padding:2.4cqw 3cqw;font-size:3.1cqw;line-height:1.4;white-space:pre-wrap}.sl .pbox.sm{font-size:2.3cqw}
.sl table{border-collapse:collapse;width:100%;font-size:2.4cqw}.sl th{background:var(--navy);color:#fff;text-align:left;padding:1.2cqw 1.6cqw}.sl td{border-bottom:1px solid #d9e2ee;padding:1.2cqw 1.6cqw}
.sl.tipS{background:var(--light)}.sl.tipS.safe .tag{background:#fff3cd}.deck.biz .sl.tipS.safe .tag{background:#FDECEA;color:#B42318}
.sl .sf{position:absolute;left:8cqw;right:3cqw;bottom:1.8cqw;display:flex;justify-content:space-between;font-size:1.5cqw;color:#6b7a89}.sl .sf::after{content:counter(sl)}
.sl .nt{display:none}
.sl.tl,.sl.cl{background:var(--navy);color:#fff}.sl.tl .si,.sl.cl .si{padding-left:8cqw}.sl.tl p,.sl.cl p{font-size:2.8cqw;line-height:1.4;opacity:.92;white-space:pre-line}.sl .slogo{width:11cqw;height:11cqw;border-radius:2cqw;object-fit:contain}.sl.tl .sf,.sl.cl .sf{color:#b9c9da}
@media print{header.top,.seg,.card,.note,.btn,footer,.muted{display:none!important}.doc{border:0}.doc .hero,.doc th,.doc ol.st li::before{-webkit-print-color-adjust:exact;print-color-adjust:exact}.doc .blk{break-inside:avoid}}

.sl.tl .si,.sl.cl .si{padding-top:3.5cqw;padding-bottom:9cqw}.sl .slogo{width:9cqw;height:9cqw;background:#fff;padding:.9cqw;border-radius:2cqw;box-shadow:0 .4cqw 1.6cqw rgba(0,0,0,.3)}.sl.tl h1{font-size:5.6cqw;margin:1.6cqw 0 1.6cqw}.sl.tl .eye{margin-top:2cqw}.sl .stag{margin-top:2cqw}
.namef{display:block;margin:0 0 10px}.card input[type=text],.namef input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;box-sizing:border-box}
.actbar{position:sticky;top:var(--hh,0px);z-index:4;background:#fff;padding:8px 0 6px;margin:0 0 8px;border-bottom:1px solid var(--line)}.actbar .row{display:flex;gap:10px}.actbar .btn{margin:0;flex:1;min-height:48px}
.modal{position:fixed;inset:0;background:rgba(10,25,40,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.mbox{background:#fff;border-radius:18px;padding:18px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.pipe{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}.pstep{border:1px solid #CBD5E1;background:#fff;color:#475569;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600;cursor:pointer}.pstep.ok{background:#DCFCE7;border-color:#86EFAC;color:#14532D}.pstep.skip{background:#F1F3F6;border-style:dashed;color:#64748B}.pinfo{width:30px;height:30px;border-radius:50%;border:1px solid #94A3B8;background:#fff;color:#334155;font-weight:700;font-style:italic;font-family:Georgia,serif;cursor:pointer}.phist{background:#fff;border:1px solid #E2E8F0;border-radius:10px;padding:8px 10px;margin:0 0 8px;font-size:14px;color:#334155}.pstep.on{background:var(--navy);border-color:var(--navy);color:#fff}.pstep.side{border-style:dashed}
.pnext{background:#F1F3F6;border-radius:10px;padding:10px 12px;margin:0 0 10px}
@media print{.actbar,.modal{display:none!important}}
.row2{display:flex;gap:12px}.row2 label{flex:1}.row2 input{width:100%;font:inherit;font-size:17px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;box-sizing:border-box}
.vd{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;white-space:nowrap;border:1.5px solid}.vd.yes{background:#E7F6EC;color:#14632F;border-color:#14632F}.vd.partial{background:#FFF1EB;color:#9A3412;border-color:#C2410C}.vd.no{background:#FDECEC;color:#9A1C1C;border-color:#9A1C1C}.vd.unknown{background:#EEF1F5;color:#41505F;border-color:#41505F}
.verdict.yes{border-left:8px solid #14632F}.verdict.partial{border-left:8px solid #C2410C}.verdict.no{border-left:8px solid #9A1C1C}
</style>

/* Safe DOM builder: strings are always text nodes, never HTML. */
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "disabled") n.disabled = !!v;
    else if (v === true) n.setAttribute(k, "");
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
}

async function copyText(txt) {

  catch (e) {
    const ta = el("textarea", { readonly: true, style: "position:fixed;top:0;opacity:0" });
    ta.value = txt; document.body.append(ta); ta.focus(); ta.select();

    ta.remove(); return ok;
  }
}

const Cloud = {
  started: false, queue: {}, timer: null, busy: false,
  async tok() {
    let a = Auth.load(); if (!a) return null;
    if (a.expires < Date.now() + 60000) { if ((await Auth.verify()) !== "ok") return null; a = Auth.load(); }
    let uid = ""; try { uid = JSON.parse(atob(a.access.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).sub || ""; } catch (e) {}
    return uid ? { access: a.access, uid } : null;
  },
  async req(method, path, body, prefer) {
    const k = await Cloud.tok(); if (!k) return { ok: false, status: 401 };
    const c = new AbortController(), to = setTimeout(() => c.abort(), 20000);
    try {
      const r = await fetch(AUTH.url + "/rest/v1/toolkit_sessions" + path.replace("{uid}", encodeURIComponent(k.uid)), { method, signal: c.signal, body: body ? JSON.stringify(body.map ? body.map(x => Object.assign({ user_id: k.uid }, x)) : body) : undefined,
        headers: Object.assign({ apikey: AUTH.key, Authorization: "Bearer " + k.access, "Content-Type": "application/json" }, prefer ? { Prefer: prefer } : {}) });
      let j = null; try { j = await r.json(); } catch (e) {}
      return { ok: r.ok, status: r.status, json: j };
    } finally { clearTimeout(to); }
  },
  set(status, msg) { S.cloud = { status, msg: msg || "", at: Date.now() }; },
  fail(r) { Cloud.set(r.status === 404 || (r.json && /PGRST20[0-9]|does not exist|schema cache/i.test(JSON.stringify(r.json))) ? "setup" : "error", r.status ? "HTTP " + r.status : ""); },
  push(rec) { if (S.auth.status !== "in") return; Cloud.queue[rec.id] = rec; clearTimeout(Cloud.timer); Cloud.timer = setTimeout(Cloud.flush, 2500); },
  async flush() {
    const rows = Object.values(Cloud.queue); Cloud.queue = {}; if (!rows.length) return;
    try {
      const r = await Cloud.req("POST", "?on_conflict=user_id,id", rows.map(x => ({ id: x.id, data: x, updated_at: new Date(x.updated || Date.now()).toISOString() })), "resolution=merge-duplicates,return=minimal");
      if (r.ok) Cloud.set("ok"); else { Cloud.fail(r); rows.forEach(x => { Cloud.queue[x.id] = x; }); }
    } catch (e) { Cloud.set("offline"); rows.forEach(x => { Cloud.queue[x.id] = x; }); }
    if (["home", "sessions"].includes(S.screen)) render();
  },
  async remove(id) { if (S.auth.status !== "in") return; delete Cloud.queue[id]; try { const r = await Cloud.req("DELETE", "?user_id=eq.{uid}&id=eq." + encodeURIComponent(id)); if (!r.ok) Cloud.fail(r); } catch (e) { Cloud.set("offline"); } },
  async removeAll() { if (S.auth.status !== "in") return; Cloud.queue = {}; try { const r = await Cloud.req("DELETE", "?user_id=eq.{uid}"); if (!r.ok) Cloud.fail(r); else Cloud.set("ok"); } catch (e) { Cloud.set("offline"); } },
  /* Two-way merge: newest copy of each session wins. Everything from the cloud is validated like a backup file. */
  async sync() {
    if (Cloud.busy || S.auth.status !== "in") return; Cloud.busy = true; Cloud.set("syncing"); if (["home", "sessions"].includes(S.screen)) render();
    try {
      const r = await Cloud.req("GET", "?select=id,data,updated_at&user_id=eq.{uid}&order=updated_at.desc&limit=" + LIMITS.sessions);
      if (!r.ok || !Array.isArray(r.json)) { Cloud.fail(r); return; }
      const local = Store.all(), byId = {}; local.forEach(x => { byId[x.id] = x; });
      const cloud = {}, merged = local.slice(); let pulled = 0;
      for (const row of r.json) {
        const c = cleanSession(row && row.data); if (c.error) continue;
        cloud[c.rec.id] = c.rec;
        const mine = byId[c.rec.id];
        if (!mine) { merged.push(c.rec); pulled++; if (c.rec.lead && !c.rec.lead.archived) { const u = unseenLeads(); u.push(c.rec.id); unseenLeadsSet(u); } }
        else if (c.rec.updated > (mine.updated || 0)) { merged[merged.findIndex(x => x.id === mine.id)] = c.rec; pulled++; }
      }
      if (pulled && !Store.write(merged)) { Cloud.set("error", "storage"); return; }
      Store.all().forEach(x => { if (!cloud[x.id] || (x.updated || 0) > cloud[x.id].updated) Cloud.queue[x.id] = x; });
      Cloud.set("ok", pulled ? String(pulled) : "");
      if (Object.keys(Cloud.queue).length) await Cloud.flush();
    } catch (e) { Cloud.set("offline"); }
    finally { Cloud.busy = false; if (["home", "sessions"].includes(S.screen)) render(); }
  }
};
